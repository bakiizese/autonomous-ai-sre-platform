server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routes (/dashboard, /about) — any path that
    # isn't a real file has to fall back to index.html or a refresh 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
